<!DOCTYPE html>
<html>
<head>
  <title>Squid Game Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mainpage">

    <img src="./backgroung.png" class="bgimage" width="100%">

    <div class="topbar">
      <div class="logo">SQUID GAME</div>
      <div class="menulinks">
        <span>About</span>
        <span class="active">Watch now</span>
        <span>Actors</span>
        <span>Contact</span>
      </div>
    </div>

    <div class="textbox">
      <h1 class="bigtitle">SQUID GAME</h1>
      <p class="info">Action / Thriller / Drama Series directed by Dong-hyuk Hwang</p>
      <p class="info2">Season 1: 9 Episodes</p>
    </div>

    <div class="buttonbox">
      <button class="btn1">▶ Play Now</button>
      <button class="btn2">▷ Watch Trailer</button>
    </div>

    <img src="./hiest.png" class="character">

    <div class="bottomrow">
      
      <div class="smallbox boxleft">
        <img src="./1.png" class="boximg">
      </div>

      <div class="smallbox boxcenter">
        <img src="./2.png" class="boximg">
      </div>

      <div class="smallbox boxright">
        <img src="./3.png" class="boximg">
      </div>

    </div>

  </div>

</body>
</html>
